global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s

frontend entrada
    bind *:80
    acl api_users        path_beg /api/users/
    acl api_measurements path_beg /api/measurements/
    acl api_progress     path_beg /api/progress/
    acl api_goals        path_beg /api/goals/
    acl api_workouts     path_beg /api/workouts/
    use_backend users        if api_users
    use_backend measurements if api_measurements
    use_backend progress     if api_progress
    use_backend goals        if api_goals
    use_backend workouts     if api_workouts
    default_backend web

backend web
    balance roundrobin
    server-template web 1-3 nginx:80 check resolvers docker resolve-prefer ipv4 init-addr none

backend users
    balance roundrobin
    http-request replace-path ^/api/users/(.*) /users/\1
    server-template users 1-6 users:8002 check resolvers docker resolve-prefer ipv4 init-addr none

backend measurements
    balance roundrobin
    http-request replace-path ^/api/measurements/(.*) /\1
    server-template measurements 1-6 measurements:8001 check resolvers docker resolve-prefer ipv4 init-addr none

backend progress
    balance roundrobin
    http-request replace-path ^/api/progress/(.*) /progress/\1
    server-template progress 1-6 progress:8005 check resolvers docker resolve-prefer ipv4 init-addr none

backend goals
    balance roundrobin
    http-request replace-path ^/api/goals/(.*) /goals/\1
    server-template goals 1-6 goals:8004 check resolvers docker resolve-prefer ipv4 init-addr none

backend workouts
    balance roundrobin
    http-request replace-path ^/api/workouts/(.*) /api/routines/\1
    server-template workouts 1-6 workouts:8003 check resolvers docker resolve-prefer ipv4 init-addr none

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:admin
