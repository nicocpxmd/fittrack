# Requiere nodos etiquetados:
#   docker node update --label-add role=server <hostname-del-manager>
#   docker node update --label-add role=worker <hostname-del-worker>
# FITTRACK_DIR es la ruta del repo en el nodo servidor; por defecto /root/fittrack.
x-servidor: &servidor
  replicas: 1
  restart_policy:
    condition: any
    delay: 5s
  placement:
    constraints:
      - node.labels.role == server

services:
  nginx:
    image: nicocpxm/fittrack-nginx:v4
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == worker

  haproxy:
    image: nicocpxm/fittrack-haproxy:v2
    ports:
      - "8080:80"
      - "8404:8404"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.labels.role == worker

  users:
    image: nicocpxm/fittrack-users:v2
    environment:
      DATABASE_URL: postgresql+psycopg://fittrack:${POSTGRES_PASSWORD}@postgres:5432/fittrack_users
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    deploy: *servidor

  measurements:
    image: nicocpxm/fittrack-measurements:v1
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: fittrack_measurements
      USERS_SERVICE_URL: http://users:8002
    deploy: *servidor

  progress:
    image: nicocpxm/fittrack-progress:v1
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: fittrack_progress
      USERS_SERVICE_URL: http://users:8002
      MEASUREMENTS_SERVICE_URL: http://measurements:8001
    deploy: *servidor

  workouts:
    image: nicocpxm/fittrack-workouts:v1
    environment:
      PORT: "8003"
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: workouts
      USERS_SERVICE_URL: http://users:8002
    deploy: *servidor

  goals:
    image: nicocpxm/fittrack-goals:v1
    environment:
      GOALS_PORT: "8004"
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: goals
      USERS_SERVICE_URL: http://users:8002
      PROGRESS_SERVICE_URL: http://progress:8005
      WORKOUTS_SERVICE_URL: http://workouts:8003
      MEASUREMENTS_SERVICE_URL: http://measurements:8001
    deploy: *servidor

  analytics:
    image: nicocpxm/fittrack-analytics:v1
    environment:
      DATA_FILE: /data/analytics.json
    volumes:
      - ${FITTRACK_DIR:-/root/fittrack}/analytics/data:/data:ro
    deploy: *servidor

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fittrack_users
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy: *servidor

  mongo:
    image: mongo:4.4
    volumes:
      - mongodata:/data/db
    deploy: *servidor

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
      - ${FITTRACK_DIR:-/root/fittrack}/docker/mysql-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ${FITTRACK_DIR:-/root/fittrack}/services/goals/schema.sql:/schemas/goals.sql:ro
      - ${FITTRACK_DIR:-/root/fittrack}/services/workouts/schema.sql:/schemas/workouts.sql:ro
    deploy: *servidor

volumes:
  pgdata:
  mongodata:
  mysqldata:
