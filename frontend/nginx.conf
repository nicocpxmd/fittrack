server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location / { try_files $uri /index.html; }

    location /api/users/        { proxy_pass http://users:8002/users/; }
    location /api/measurements/ { proxy_pass http://measurements:8001/; }
    location /api/progress/     { proxy_pass http://progress:8005/progress/; }
    location /api/goals/        { proxy_pass http://goals:8004/goals/; }
    location /api/workouts/     { proxy_pass http://workouts:8003/api/routines/; }
}
