# En el stack de Swarm, HAProxy es el unico punto de entrada de /api/*.
# nginx solo sirve el frontend estatico. Si proxeara a los servicios,
# fallaria al arrancar cuando aun no existen (host not found in upstream).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
